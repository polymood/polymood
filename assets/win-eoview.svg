<rect x="6" y="57" width="828" height="178" fill="#fff"/><path d="M6.5,235 V57.5 H834" fill="none" stroke="#808080"/>
<text x="20" y="83" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">Desktop viewer for Earth observation data: GeoTIFF and COG, JPEG 2000,</text><text x="20" y="102" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">NITF, EOPF Zarr, Sentinel-1, -2 and -3 SAFE, NetCDF-4 and HDF5. A chunk</text><text x="20" y="121" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">engine streams local files, HTTP and S3 while the interface stays fluid.</text><text x="20" y="140" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">Time series with a timeline, and a first 3D globe.</text>
<line x1="624" y1="69" x2="624" y2="223" stroke="#c0c0c0"/>
<text x="640" y="83" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#000080">BUILT WITH</text><text x="640" y="102" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">Rust</text><text x="640" y="121" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">wgpu</text><text x="640" y="140" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">egui</text><text x="640" y="178" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#000080">DETAILS</text><text x="640" y="197" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">Windows, Linux, macOS</text><text x="640" y="216" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">installers, self-update</text>
