<text x="20" y="83" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">Open-source mapping tools for Source engine games, built one useful piece</text><text x="20" y="102" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">at a time on the way to a Hammer++ replacement. Today: a texture browser</text><text x="20" y="121" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">that mounts VPKs, game detection from gameinfo.txt, lossless VMF round-</text><text x="20" y="140" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">trip, brush geometry and Python plugins.</text>
<line x1="624" y1="69" x2="624" y2="204" stroke="#c0c0c0"/>
<text x="640" y="83" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#000080">BUILT WITH</text><text x="640" y="102" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#000080">C++</text><text x="640" y="121" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">Qt 6</text><text x="640" y="140" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">Python plugins</text><text x="640" y="178" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="11" font-weight="bold" fill="#000080">DETAILS</text><text x="640" y="197" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="12" font-weight="normal" fill="#222">status: pre-alpha</text>
