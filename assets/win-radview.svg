<text x="20" y="83" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">GPU viewer for SAR and ISAR imagery: NITF (SICD, SIDD), TIFF, BigTIFF and</text><text x="20" y="102" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">COG. Shows complex data as amplitude, phase, I or Q, opens files larger</text><text x="20" y="121" font-family="Verdana, Tahoma, Geneva, 'DejaVu Sans', sans-serif" font-size="13" fill="#000">than 10 GB, and has editable color maps with a dB stretch.</text>
